<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; manifest-src 'self' data:; worker-src 'self'">
<title>Portfolio</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* Portfolio — iOS-native feel. Light + dark. Safe areas. No spreadsheet chrome. */
:root {
  --bg: #F2F2F7;
  --bg-elev: #FFFFFF;
  --bg-grouped: #F2F2F7;
  --label: #1C1C1E;
  --secondary: #8E8E93;
  --tertiary: #C7C7CC;
  --sep: rgba(60, 60, 67, 0.12);
  --fill: rgba(118, 118, 128, 0.12);
  --fill-strong: rgba(118, 118, 128, 0.2);
  --navy: #1F3A5F;
  --teal: #2A9D8F;
  --green: #05A66B;
  --green-deep: #1F7A4C;
  --gold: #E9A23B;
  --coral: #E85D4C;
  --blue: #3D7DD8;
  --purple: #7E57C2;
  --pink: #C2185B;
  --amber-bg: #FFF3CD;
  --amber-fg: #8A5A00;
  --red: #C0392B;
  --pos: #1F7A4C;
  --shadow: 0 8px 28px rgba(31, 58, 95, 0.08), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-sm: 0 2px 10px rgba(31, 58, 95, 0.06);
  --tab-bg: rgba(255, 255, 255, 0.86);
  --sheet-bg: #FFFFFF;
  --ring: rgba(31, 58, 95, 0.18);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
  --tab-h: 52px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --bg-elev: #1C1C1E;
    --bg-grouped: #000000;
    --label: #F2F2F7;
    --secondary: #8E8E93;
    --tertiary: #48484A;
    --sep: rgba(84, 84, 88, 0.36);
    --fill: rgba(118, 118, 128, 0.24);
    --fill-strong: rgba(118, 118, 128, 0.36);
    --amber-bg: #3D3000;
    --amber-fg: #FFD56A;
    --shadow: 0 8px 28px rgba(0,0,0,0.45);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --tab-bg: rgba(22, 22, 24, 0.88);
    --sheet-bg: #1C1C1E;
    --ring: rgba(255,255,255,0.12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --bg-elev: #1C1C1E;
  --bg-grouped: #000000;
  --label: #F2F2F7;
  --secondary: #8E8E93;
  --tertiary: #48484A;
  --sep: rgba(84, 84, 88, 0.36);
  --fill: rgba(118, 118, 128, 0.24);
  --fill-strong: rgba(118, 118, 128, 0.36);
  --amber-bg: #3D3000;
  --amber-fg: #FFD56A;
  --shadow: 0 8px 28px rgba(0,0,0,0.45);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --tab-bg: rgba(22, 22, 24, 0.88);
  --sheet-bg: #1C1C1E;
  --ring: rgba(255,255,255,0.12);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--label); font-family: var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
img, svg { display: block; }
a { color: var(--blue); }

#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  background: var(--bg);
}

.app-header {
  padding: 8px 20px 12px;
  position: sticky;
  top: 0;
  z-index: 20;
  background: linear-gradient(to bottom, var(--bg) 70%, transparent);
}
.app-header .top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 32px;
  color: var(--secondary);
  font-size: 13px;
  font-weight: 500;
}
.app-header h1 {
  margin: 8px 0 0;
  font-size: 34px;
  line-height: 1.1;
  letter-spacing: -0.6px;
  font-weight: 800;
  color: var(--label);
}
.app-header .actions { display: flex; gap: 8px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 14px; border-radius: 999px;
  font-size: 13px; font-weight: 600;
  background: var(--fill); color: var(--label);
  transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s;
}
.pill:active { transform: scale(0.96); opacity: 0.85; }
.pill.navy { background: var(--navy); color: #fff; }
.pill.teal { background: var(--teal); color: #fff; }
.pill.gold { background: var(--gold); color: #1C1408; }
.pill.green { background: var(--green); color: #fff; }
.pill.coral { background: var(--coral); color: #fff; }
.pill.ghost { background: var(--fill); }
.pill.badge { position: relative; }
.dot-badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px;
  background: var(--coral); color: #fff; font-size: 11px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}

#views {
  flex: 1;
  padding: 0 16px calc(var(--tab-h) + var(--safe-bot) + 88px);
}

.view { animation: fadeup 0.28s ease; }
@keyframes fadeup {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

.card {
  background: var(--bg-elev);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 16px 16px 14px;
  margin: 0 0 12px;
}
.card.pressable { transition: transform 0.12s ease; }
.card.pressable:active { transform: scale(0.985); }

.hero-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  padding: 18px 18px 16px;
  color: #fff;
  box-shadow: var(--shadow);
  min-height: 108px;
}
.hero .kicker {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; opacity: 0.82;
}
.hero .value {
  font-size: 34px; font-weight: 700; letter-spacing: -0.8px;
  margin-top: 8px; line-height: 1.1; word-break: break-word;
  font-variant-numeric: tabular-nums;
}
.hero .sub { margin-top: 8px; font-size: 13px; opacity: 0.85; }
.hero.navy { background: linear-gradient(160deg, #2F5D8C, #1F3A5F 55%, #15283F); }
.hero.teal { background: linear-gradient(160deg, #3BB8A8, #1F7A6A); }
.hero.coral { background: linear-gradient(160deg, #F07A6C, #C44536); }
.hero.gold { background: linear-gradient(160deg, #F2C56B, #C48A22); color: #1C1408; }
.hero.gold .kicker, .hero.gold .sub { opacity: 0.75; }
.hero.status {
  background: linear-gradient(160deg, #F8E7A0, #E9C85A);
  color: #5C4300;
}
.hero.status .kicker { color: #8A5A00; }

.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat {
  background: var(--bg-elev); border-radius: 18px; padding: 16px 14px 14px;
  box-shadow: var(--shadow-sm);
  min-height: 88px;
}
.stat.pressable { transition: transform 0.12s ease; }
.stat.pressable:active { transform: scale(0.985); }
.stat .k { font-size: 12px; color: var(--secondary); font-weight: 600; }
.stat .v { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.stat .meta { font-size: 11px; color: var(--secondary); margin-top: 4px; font-weight: 500; }

.money, .hero .value, .right, .loan-card .n { font-variant-numeric: tabular-nums; }
.money.pos { color: var(--pos); }
.money.neg, .money.debt { color: var(--red); }
.money.zero { color: var(--label); }

.banner {
  border-radius: 16px; padding: 12px 14px; margin: 0 0 12px;
  font-size: 14px; line-height: 1.35; font-weight: 560;
}
.banner.amber { background: var(--amber-bg); color: var(--amber-fg); }
.banner.red { background: rgba(192,57,43,0.12); color: var(--red); }
.banner.info { background: var(--fill); color: var(--label); }
.banner .title { font-weight: 700; display: block; margin-bottom: 2px; }

.section-label {
  font-size: 13px; font-weight: 600; color: var(--secondary);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin: 18px 6px 8px;
}

.list-card { background: var(--bg-elev); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; min-height: 60px;
  border-bottom: 0.5px solid var(--sep);
  text-align: left; width: 100%; background: transparent; color: inherit;
  transition: background 0.12s;
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--fill); }
.row .icon-bubble {
  width: 36px; height: 36px; border-radius: 10px; flex: none;
  display: flex; align-items: center; justify-content: center;
  color: #fff;
}
.row .body { flex: 1; min-width: 0; }
.row .title { font-weight: 650; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 13px; color: var(--secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .right { text-align: right; font-weight: 650; font-size: 16px; }
.chev { color: var(--tertiary); flex: none; }

.chip {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
  border-radius: 99px; font-size: 11px; font-weight: 700;
}
.chip.amber { background: var(--amber-bg); color: var(--amber-fg); }
.chip.green { background: rgba(5,166,107,0.15); color: var(--green-deep); }
.chip.red { background: rgba(192,57,43,0.12); color: var(--red); }

.empty {
  text-align: center; padding: 36px 20px; color: var(--secondary);
}
.empty p { margin: 8px 0 0; font-size: 15px; line-height: 1.45; }
.empty h3 { margin: 0; color: var(--label); font-size: 18px; }
.empty .btn { margin: 18px auto 0; max-width: 240px; }

.welcome {
  padding: 24px 16px 40px;
  text-align: center;
}
.welcome .mark {
  width: 88px; height: 88px; margin: 36px auto 18px;
  border-radius: 22px; box-shadow: var(--shadow);
}
.welcome h2 { font-size: 28px; letter-spacing: -0.5px; margin: 0 0 8px; }
.welcome p { color: var(--secondary); font-size: 15px; line-height: 1.45; margin: 0 16px 22px; }
.welcome .cta { height: 52px; padding: 0 22px; font-size: 17px; border-radius: 16px; }

.help-line {
  font-size: 12px; color: var(--secondary); text-align: center;
  margin: 8px 12px 0; line-height: 1.4;
}

.search {
  width: 100%; height: 44px; border: 0; border-radius: 12px;
  background: var(--fill); padding: 0 14px; margin: 0 0 14px;
  outline: none; font-size: 16px;
}
.search:focus { box-shadow: 0 0 0 3px var(--ring); }

.loan-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.loan-card h3 { margin: 0; font-size: 18px; letter-spacing: -0.3px; }
.loan-card .grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 14px;
}
.loan-card .f { font-size: 11px; color: var(--secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.loan-card .n { font-size: 16px; font-weight: 650; margin-top: 2px; }

#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--tab-h) + var(--safe-bot));
  padding-bottom: var(--safe-bot);
  display: flex; justify-content: space-around; align-items: stretch;
  background: var(--tab-bg);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--sep);
}
#tabbar button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: var(--secondary); font-size: 10px; font-weight: 600;
  transition: color 0.15s, transform 0.12s;
}
#tabbar button svg { width: 26px; height: 26px; }
#tabbar button.on { color: var(--navy); }
:root[data-theme="dark"] #tabbar button.on { color: #7EB0FF; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #tabbar button.on { color: #7EB0FF; }
}
#tabbar button:active { transform: scale(0.94); }

.fab {
  position: fixed;
  right: 18px;
  bottom: calc(var(--tab-h) + var(--safe-bot) + 16px);
  width: 56px; height: 56px; border-radius: 28px;
  background: var(--navy); color: #fff;
  box-shadow: 0 8px 24px rgba(31,58,95,0.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 25;
  transition: transform 0.12s;
}
.fab:active { transform: scale(0.94); }
.fab.gold { background: #C48A22; box-shadow: 0 8px 24px rgba(196,138,34,0.35); }
.fab.teal { background: var(--teal); box-shadow: 0 8px 24px rgba(42,157,143,0.35); }

/* Bottom sheet */
#overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.36);
  z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
#overlay.on { opacity: 1; pointer-events: auto; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-height: min(92vh, 760px);
  background: var(--sheet-bg);
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.18);
  transform: translateY(110%);
  transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; flex-direction: column;
  padding-bottom: var(--safe-bot);
}
#sheet.on { transform: translateY(0); }
.sheet-handle { width: 36px; height: 5px; border-radius: 99px; background: var(--fill-strong); margin: 8px auto 0; }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px 12px;
}
.sheet-head h2 { margin: 0; font-size: 18px; font-weight: 700; }
.sheet-body { overflow: auto; padding: 0 16px 16px; -webkit-overflow-scrolling: touch; }
.field { margin: 0 0 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--secondary); margin: 0 0 6px; }
.field input, .field select, .field textarea {
  width: 100%; border: 0; background: var(--fill); border-radius: 12px;
  padding: 14px 14px; outline: none; font-size: 17px; min-height: 50px;
}
.field textarea { min-height: 72px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { box-shadow: 0 0 0 3px var(--ring); }
.field .hint { font-size: 12px; color: var(--secondary); margin-top: 6px; }
.field .err { font-size: 12px; color: var(--red); margin-top: 6px; }
.sheet-actions { display: flex; gap: 8px; padding: 8px 0 4px; }
.btn {
  flex: 1; height: 50px; border-radius: 14px; font-size: 17px; font-weight: 650;
  background: var(--navy); color: #fff;
  transition: transform 0.12s, opacity 0.12s;
}
.btn:active { transform: scale(0.98); opacity: 0.9; }
.btn.secondary { background: var(--fill); color: var(--label); }
.btn.danger { background: var(--coral); }
.btn:disabled { opacity: 0.45; }

.pending-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--bg-elev); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px;
  box-shadow: var(--shadow-sm); font-size: 14px; font-weight: 600;
}

.chart { width: 100%; height: 160px; }
.guide { font-size: 15px; line-height: 1.45; color: var(--label); }
.guide li { margin: 0 0 8px; }
.muted { color: var(--secondary); font-size: 13px; }

.split { display: flex; gap: 8px; }
.split .field { flex: 1; }

.file-meta {
  flex: 1; min-width: 0;
  font-size: 12px; color: var(--secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.app-header .actions { flex: none; }


kbd { font: inherit; }

[hidden] { display: none !important; }
.fab.coral { background: var(--coral); box-shadow: 0 8px 24px rgba(232,93,76,0.35); }
form.sheet-body { display: block; }
button.card, button.row, .loan-card { display: block; width: 100%; text-align: left; }
button.row { display: flex; }
.loan-card { margin-bottom: 12px; border-top: 4px solid var(--navy); }
.loan-card .top { margin-bottom: 4px; }
.loan-card.amber-edge { border-top-color: var(--gold); }
.stat .v.status-txt { font-size: 15px; color: var(--amber-fg); }
.pill { white-space: nowrap; }

/* Net-worth trend chart (Home + History) */
.chart, svg.trend { --chart-stroke: var(--teal); }
.nw-chart {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--bg-elev);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
  padding: 16px 16px 12px;
  margin: 0 0 12px;
  color: inherit;
  --chart-stroke: var(--teal);
  transition: transform 0.12s ease;
}
.nw-chart:active { transform: scale(0.985); }
.nw-chart.down { --chart-stroke: var(--coral); }
.nw-chart.flat { --chart-stroke: var(--secondary); }
.nw-chart .chart-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
}
.nw-chart .chart-kicker {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--secondary);
}
.nw-chart .chart-latest { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
.nw-chart .chart-change { margin-top: 6px; font-size: 13px; font-weight: 650; color: var(--secondary); }
.nw-chart .chart-change.up { color: var(--pos); }
.nw-chart .chart-change.down { color: var(--red); }
.nw-chart .chart-empty {
  padding: 16px 2px 6px; color: var(--secondary);
  font-size: 15px; line-height: 1.4; font-weight: 500;
}
.nw-chart svg.trend { width: 100%; height: 148px; display: block; margin-top: 10px; }
.nw-chart .chart-axis {
  display: flex; justify-content: space-between; margin-top: 2px;
  font-size: 11px; color: var(--secondary); font-weight: 600;
}
:root[data-theme="dark"] .nw-chart:not(.down):not(.flat) { --chart-stroke: #3ECFAF; }
:root[data-theme="dark"] .nw-chart.down { --chart-stroke: #FF8A7A; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .nw-chart:not(.down):not(.flat) { --chart-stroke: #3ECFAF; }
  :root:not([data-theme="light"]) .nw-chart.down { --chart-stroke: #FF8A7A; }
}

/* First-run hint + steps */
.hint-card {
  text-align: left;
  background: var(--bg-elev);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
  padding: 16px 16px 14px;
  margin: 0 0 14px;
}
.hint-card .hint-top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 4px;
}
ol.steps {
  list-style: none; margin: 10px 0 0; padding: 0; counter-reset: step;
}
ol.steps li {
  position: relative;
  counter-increment: step;
  padding: 9px 0 9px 36px;
  font-size: 15px; font-weight: 600; color: var(--label);
  border-bottom: 0.5px solid var(--sep);
}
ol.steps li:last-child { border-bottom: 0; padding-bottom: 2px; }
ol.steps li::before {
  content: counter(step);
  position: absolute; left: 0; top: 8px;
  width: 24px; height: 24px; border-radius: 99px;
  background: var(--navy); color: #fff;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  line-height: 24px; text-align: center;
}
ol.steps li.done { color: var(--secondary); }
ol.steps li.done::before { background: var(--green); content: "✓"; }
.welcome-steps { margin: 22px 0 8px; }

.hero .asof-link {
  display: inline-block;
  margin-top: 10px;
  font-size: 13px;
  opacity: 0.9;
  font-weight: 600;
  background: transparent;
  color: inherit;
  padding: 0;
}
.hero .asof-link:active { opacity: 0.7; }

.pill.save-idle { color: var(--navy); }
:root[data-theme="dark"] .pill.save-idle { color: #7EB0FF; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pill.save-idle { color: #7EB0FF; }
}

#sheet .row { min-height: 64px; }

/* Long-list tools */
.list-toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  margin: 0 0 10px;
}
.list-toolbar .search { flex: 1 1 160px; margin: 0; }
.list-sort {
  height: 44px; border: 0; border-radius: 12px;
  background: var(--fill); padding: 0 12px; font-size: 15px; min-width: 140px;
  outline: none;
}
.list-sort:focus { box-shadow: 0 0 0 3px var(--ring); }
.list-summary {
  font-size: 13px; font-weight: 600; color: var(--secondary);
  margin: 0 4px 10px;
}
.show-more { width: 100%; margin: 4px 0 14px; }
.loan-card h3, .loan-card .meta { overflow: hidden; text-overflow: ellipsis; }
.list-card .row { content-visibility: auto; contain-intrinsic-size: auto 60px; }

/* Expanded screens (unfolded foldable, iPad). Phone width stays unchanged. */
@media (min-width: 700px) {
  .app-header {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding-left: 28px;
    padding-right: 28px;
  }
  #views {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding-left: 28px;
    padding-right: 28px;
  }
  .welcome { max-width: 560px; margin: 0 auto; }
  .top-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: stretch;
    margin-bottom: 14px;
  }
  .top-grid .hero-grid { margin-bottom: 0; }
  .top-grid .nw-chart { margin-bottom: 0; height: 100%; }
  .hero { min-height: 140px; }
  #sheet {
    left: 50%;
    right: auto;
    bottom: auto;
    top: 50%;
    width: min(560px, calc(100vw - 48px));
    max-height: min(85vh, 760px);
    border-radius: 18px;
    transform: translate(-50%, -50%) scale(0.96);
    opacity: 0;
    pointer-events: none;
    padding-bottom: 12px;
  }
  #sheet.on {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .fab { right: 28px; }
}

@media (min-width: 860px) {
  .stat-row { grid-template-columns: repeat(4, 1fr); }
  .loans-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: start;
  }
}

/* Wide landscape: side navigation */
@media (min-width: 1000px) and (orientation: landscape) {
  #app { padding-left: 220px; }
  #tabbar {
    left: 0; right: auto; top: 0; bottom: 0;
    width: 220px;
    height: 100%;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    gap: 4px;
    padding: calc(var(--safe-top) + 20px) 14px 20px;
    border-top: 0;
    border-right: 0.5px solid var(--sep);
  }
  #tabbar button {
    flex: none;
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
    height: 48px;
    padding: 0 14px;
    border-radius: 14px;
    font-size: 15px;
  }
  #tabbar button svg { width: 22px; height: 22px; }
  #views { padding-bottom: 32px; }
  .fab { bottom: 28px; }
}

</style>
</head>

        const inc = cell(props, cols.include + r);
        model.properties.push({
          row: r, name: nm || "", location: cell(props, cols.location + r) || "",
          owner: cell(props, cols.owner + r) || "",
          value: num(val), mortgage: num(cell(props, cols.mortgage + r)) || 0,
          equityCached: num(cell(props, cols.equity + r)),
          currency: cell(props, cols.currency + r) || "",
          include: String(inc == null ? "" : inc).trim().toLowerCase() === "yes",
          includeRaw: inc == null ? "" : String(inc),
          updatedISO: parseDateCell(cell(props, cols.updated + r)),
          notes: cell(props, cols.notes + r) || "",
          usdCached: num(cell(props, cols.usd + r)),
          sheet: props.name
        });
      }
      model.cached.equityInclude = num(cell(props, "F61"));
      model.cached.equityAll = num(cell(props, "F62"));
    }

    if (fx) {
      model.fxRange = { sheet: fx.name, first: 7, last: 40 };
      for (let r = 7; r <= 40; r++) {
        const code = cell(fx, "A" + r);
        if (!code) continue;
        model.fx.push({
          row: r, code: String(code).trim(),
          live: num(cell(fx, "B" + r)), manual: num(cell(fx, "C" + r)),
          effectiveCached: num(cell(fx, "D" + r)),
          status: cell(fx, "E" + r) || "",
          perUsd: num(cell(fx, "F" + r)), fallback: num(cell(fx, "G" + r)),
          sheet: fx.name
        });
      }
    }

    if (history) {
      const cols = { date: "A", assets: "B", debts: "C", nw: "D", notes: "E" };
      model.historyRange = { sheet: history.name, first: 5, last: 89, cols: cols };
      for (let r = 5; r <= 89; r++) {
        const dt = parseDateCell(cell(history, "A" + r));
        const assets = num(cell(history, "B" + r));
        const debts = num(cell(history, "C" + r));
        const nw = cell(history, "D" + r);
        const notes = cell(history, "E" + r);
        if (!dt && assets == null && debts == null && (notes == null || notes === "")) continue;
        model.history.push({
          row: r, dateISO: dt, assets: assets, debts: debts,
          nw: isNum(nw) ? Number(nw) : null, notes: notes || "", sheet: history.name
        });
      }
    }

    if (ins) {
      const cols = { type: "A", insurer: "B", policy: "C", premium: "D", coverage: "E", renewal: "F", beneficiary: "G", contact: "H", notes: "I" };
      model.insuranceRange = { sheet: ins.name, first: 5, last: 69, cols: cols };
      for (let r = 5; r <= 69; r++) {
        const typ = cell(ins, "A" + r);
        const insr = cell(ins, "B" + r);
        const prem = cell(ins, "D" + r);
        if ((typ == null || typ === "") && (insr == null || insr === "") && !isNum(prem)) continue;
        model.insurance.push({
          row: r, type: typ || "", insurer: insr || "", policy: cell(ins, "C" + r) || "",
          premium: num(prem), coverage: num(cell(ins, "E" + r)),
          renewalISO: parseDateCell(cell(ins, "F" + r)),
          beneficiary: cell(ins, "G" + r) || "", contact: cell(ins, "H" + r) || "",
          notes: cell(ins, "I" + r) || "", sheet: ins.name
        });
      }
    }

    if (biz) {
      model.businessRange = { sheet: biz.name, first: 5, last: 64 };
      for (let r = 5; r <= 64; r++) {
        const nm = cell(biz, "A" + r);
        const dba = cell(biz, "B" + r);
        if ((nm == null || nm === "") && (dba == null || dba === "")) continue;
        model.business.push({
          row: r, name: nm || "", dba: dba || "", type: cell(biz, "D" + r) || "",
          own: num(cell(biz, "E" + r)), role: cell(biz, "F" + r) || "",
          person: cell(biz, "G" + r) || "", title: cell(biz, "H" + r) || "",
          phone: cell(biz, "I" + r) || "", email: cell(biz, "J" + r) || "",
          state: cell(biz, "K" + r) || "", formedISO: parseDateCell(cell(biz, "L" + r)),
          address: cell(biz, "M" + r) || "", city: cell(biz, "N" + r) || "",
          st: cell(biz, "O" + r) || "", zip: cell(biz, "P" + r) == null ? "" : String(cell(biz, "P" + r)),
          sheet: biz.name
        });
      }
    }

    if (cashflow) {
      model.cashflow.totals = {
        income: num(cell(cashflow, "B3")), expenses: num(cell(cashflow, "D3")),
        net: num(cell(cashflow, "F3")), bills: num(cell(cashflow, "H3"))
      };
      let incH = 6, expH = 96, billH = 187;
      for (let r = 1; r <= 200; r++) {
        const a = String(cell(cashflow, "A" + r) || "").toLowerCase();
        if (a === "source") incH = r;
        if (a === "expense") expH = r;
        if (a === "bill") billH = r;
      }
      function pullCf(first, last, kind) {
        const rows = [];
        for (let r = first; r <= last; r++) {
          const nm = cell(cashflow, "A" + r);
          const am = cell(cashflow, "C" + r);
          if ((nm == null || nm === "") && !isNum(am)) continue;
          rows.push({
            row: r, kind: kind, name: nm || "", category: cell(cashflow, "B" + r) || "",
            amount: num(am), pays: num(cell(cashflow, "D" + r)),
            currency: cell(cashflow, "F" + r) || "",
            notes: cell(cashflow, "H" + r) || "",
            dueISO: kind === "bills" ? parseDateCell(cell(cashflow, "D" + r)) : null,
            paidISO: kind === "bills" ? parseDateCell(cell(cashflow, "E" + r)) : null,
            paidRaw: kind === "bills" ? (cell(cashflow, "E" + r) == null ? null : cell(cashflow, "E" + r)) : null,
            sheet: cashflow.name
          });
        }
        return rows;
      }
      model.cashflow.income = pullCf(incH + 1, incH + 85, "income");
      model.cashflow.expenses = pullCf(expH + 1, expH + 85, "expense");
      model.cashflow.bills = pullCf(billH + 1, billH + 70, "bills");
      model.cashflow.ranges = {
        income: { sheet: cashflow.name, first: incH + 1, last: incH + 85 },
        expenses: { sheet: cashflow.name, first: expH + 1, last: expH + 85 },
        bills: { sheet: cashflow.name, first: billH + 1, last: billH + 70 }
      };
    }

    if (types) {
      const h = headerMap(types.cells, 4);
      Object.keys(h).forEach(function (label) {
        const list = [];
        for (let r = 5; r <= 80; r++) {
          const v = cell(types, h[label] + r);
          if (v) list.push(String(v));
        }
        model.types[label] = list;
      });
      model.typesSheet = types.name;
      model.typeCols = [];
      ["A", "B", "C", "D", "E", "F", "G"].forEach(function (c) {
        const label = cell(types, c + "4");
        if (!label) return;
        const items = [];
        for (let r = 5; r <= 79; r++) {
          const v = cell(types, c + r);
          if (v != null && String(v).trim() !== "") items.push({ row: r, value: String(v) });
        }
        model.typeCols.push({ col: c, label: String(label), items: items });
      });
    }

    if (guide) {
      for (let r = 1; r <= 120; r++) {
        const v = cell(guide, "A" + r);
        if (v) model.guide.push(String(v));
      }
    }

    if (home) {
      model.cached.home = {
        A6: cell(home, "A6"), D6: cell(home, "D6"), G6: cell(home, "G6"),
        B10: cell(home, "B10"), B11: cell(home, "B11"),
        B14: cell(home, "B14"), B15: cell(home, "B15"), B16: cell(home, "B16"),
        B17: cell(home, "B17"), B18: cell(home, "B18"),
        B19: cell(home, "B19"), B20: cell(home, "B20"), B21: cell(home, "B21"),
        H17: cell(home, "H17")
      };
    }
    return model;
  }

  /* FX — same order as FX!D: "1 USD =" (F) → Manual (C) → Live (B) → Fallback (G). */
  function fxEffective(row) {
    if (!row || !row.code) return null;
    if (isNum(row.perUsd) && Number(row.perUsd) !== 0) return 1 / Number(row.perUsd);
    if (isNum(row.manual)) return Number(row.manual);
    if (isNum(row.live)) return Number(row.live);
    if (isNum(row.fallback)) return Number(row.fallback);
    return null;
  }
  function fxStatus(row) {
    if (!row || !row.code) return "";
    if (isNum(row.perUsd) && Number(row.perUsd) !== 0) return "From 1 USD =";
    if (isNum(row.manual)) return "Manual override";
    if (isNum(row.live)) return "Pasted live";
    if (isNum(row.fallback)) return "Fallback (offline)";
    return "No rate";
  }
  function fxRow(model, code) {
    const c = String(code == null ? "" : code).trim().toUpperCase();
    return (model.fx || []).find(function (r) { return String(r.code).trim().toUpperCase() === c; }) || null;
  }
  // VLOOKUP(code, FX!A7:D40, 4) wrapped in IFERROR(…, 1): unknown code → 1; known code with no rate → error (NaN).
  function fxLookup(model, code) {
    const row = fxRow(model, code);
    if (!row) return 1;
    const e = fxEffective(row);
    return e == null ? NaN : e;
  }
  // Properties / Debts / Cashflow: blank currency → "USD", then look it up on FX.
  function fxRate(model, code) {
    const c = code == null || String(code).trim() === "" ? "USD" : code;
    return fxLookup(model, c);
  }
  // Accounts: blank or USD → 1 without looking at FX.
  function fxRateAccount(model, code) {
    if (code == null || String(code).trim() === "" || String(code).trim().toUpperCase() === "USD") return 1;
    return fxLookup(model, code);
  }
  function curCode(code) {
    const c = String(code == null ? "" : code).trim().toUpperCase();
    return c || "USD";
  }
  function moneyCur(n, code) {
    if (n == null || n === "" || Number.isNaN(Number(n))) return "—";
    const c = curCode(code);
    if (c === "USD") return money(n);
    try {
      const t = new Intl.NumberFormat("en-US", { style: "currency", currency: c, currencyDisplay: "narrowSymbol", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(Number(n));
      return t.indexOf(c) >= 0 ? t.replace(/\u00a0/g, " ") : t + " " + c;
    } catch (e) {
      return Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + c;
    }
  }

  function parseAprInput(s) {
    if (s === "" || s == null) return null;
    const n = Number(String(s).replace(/%/g, "").trim());
    if (!isFinite(n)) return null;
    return n > 1 ? n / 100 : n;
  }

  function ciEq(a, b) { return String(a == null ? "" : a).trim().toLowerCase() === String(b == null ? "" : b).trim().toLowerCase(); }
  function blankCell(v) { return v == null || String(v) === ""; }

  /* Port of Loans!Q (terms check), JZ (receipt check), backend amortization and W (status). */
  function loanTerms(loan, loans, asOfISO) {
    const filled = !!(!blankCell(loan.id) || !blankCell(loan.borrower) || !blankCell(loan.purpose) || !blankCell(loan.currency) ||
      isNum(loan.opening) || !blankCell(loan.apr) || !blankCell(loan.payments) || !blankCell(loan.freq) || loan.startISO);
    if (!filled) return "Inactive";
    if (blankCell(loan.id)) return "Loan ID needed";
    if (loans.filter(function (l) { return l.id && ciEq(l.id, loan.id); }).length > 1) return "Duplicate loan ID";
    if (!ciEq(loan.currency, "USD")) return "USD only";
    if (!isNum(loan.opening)) return "Opening principal needed";
    if (Number(loan.opening) < 0) return "Invalid principal";
    if (!isNum(loan.apr)) return "APR needed (blank is not zero)";
    if (Number(loan.apr) < 0) return "Invalid APR";
    if (!isNum(loan.payments)) return "Payment term needed";
    const n = Number(loan.payments);
    if (n < 1 || n !== Math.floor(n) || n > 360) return "Term must be 1–360 months";
    if (!ciEq(loan.freq, "Monthly")) return "Monthly frequency needed";
    if (!loan.startISO) return "First payment month needed";
    if (!asOfISO) return "As-of date needed";
    if (asOfISO < loan.startISO.slice(0, 8) + "01") return "As-of before first month";
    if (monthIdx(asOfISO) - monthIdx(loan.startISO) + 1 > 360) return "360-period horizon exceeded";
    return "OK";
  }
  function receiptCheck(r, loans, terms, asOfISO) {
    const any = !blankCell(r.loanId) || r.dateRaw != null && r.dateRaw !== "" || r.dateISO || (r.amountRaw != null && r.amountRaw !== "") || isNum(r.amount) || !blankCell(r.currency) || !blankCell(r.notes);
    if (!any) return { status: "Blank", slot: -1 };
    if (blankCell(r.loanId)) return { status: "Loan ID needed", slot: -1 };
    const slot = loans.findIndex(function (l) { return l.id && ciEq(l.id, r.loanId); });
    if (slot < 0) return { status: "Unknown loan ID", slot: -1 };
    const out = function (s) { return { status: s, slot: slot }; };
    if (loans.filter(function (l) { return l.id && ciEq(l.id, r.loanId); }).length > 1) return out("Duplicate loan ID");
    if (r.dateRaw == null || r.dateRaw === "") return out("Date needed");
    if (!r.dateISO || (typeof r.dateRaw === "string" && !isFinite(Number(r.dateRaw)))) return out("Invalid date");
    if (asOfISO && r.dateISO > asOfISO) return out("Future receipt date");
    if (!isNum(r.amount)) return out("Amount needed");
    if (Number(r.amount) <= 0) return out("Positive amount needed");
    if (!ciEq(r.currency, "USD")) return out("USD receipt required");
    if (!ciEq(r.currency, loans[slot].currency)) return out("Currency mismatch");
    if (terms[slot] !== "OK") return out("Loan terms needed");
    if (monthIdx(r.dateISO) < monthIdx(loans[slot].startISO)) return out("Before first payment month");
    return out("OK");
  }

  function computeLoans(model) {
    const asOf = model.asOfISO;
    const loans = model.loans;
    const terms = loans.map(function (l) { return loanTerms(l, loans, asOf); });
    const checks = model.receipts.map(function (r) { return receiptCheck(r, loans, terms, asOf); });
    model.receipts.forEach(function (r, i) { r._check = checks[i].status; });
    const asOfM = monthIdx(asOf);
    const results = loans.map(function (loan, i) {
      const t = terms[i];
      const out = { id: loan.id, row: loan.row, ready: false, inactive: t === "Inactive", status: "", terms: t,
        issues: [], principal: null, unpaid: 0, received: 0, receivedIncluded: 0, opening: loan.opening, overpay: 0, badReceipts: 0 };
      if (out.inactive) { out.status = "Inactive"; return out; }
      // J: every receipt with this ID minus those dated after the as-of date (SUMIF semantics).
      model.receipts.forEach(function (r) {
        if (!loan.id || !ciEq(r.loanId, loan.id) || !isNum(r.amount)) return;
        out.received += Number(r.amount);
        if (!(asOf && r.dateISO && r.dateISO > asOf)) out.receivedIncluded += Number(r.amount);
      });
      let dateNeeded = false;
      model.receipts.forEach(function (r, k) {
        if (!loan.id || !ciEq(r.loanId, loan.id)) return;
        const st = checks[k].status;
        if (st === "Date needed") dateNeeded = true;
        if (st !== "OK" && st !== "Blank") out.badReceipts++;
      });
      if (t === "OK") {
        const byMonth = {};
        model.receipts.forEach(function (r, k) {
          if (checks[k].status !== "OK" || !ciEq(r.loanId, loan.id)) return;
          const mi = monthIdx(r.dateISO);
          byMonth[mi] = (byMonth[mi] || 0) + Number(r.amount);
        });
        const startM = monthIdx(loan.startISO);
        const apr = Number(loan.apr);
        let O = Number(loan.opening), P = 0;
        for (let k = 0; k < 360; k++) {
          const m = startM + k;
          const Q = m <= asOfM ? O * apr / 12 : 0;
          const R = m > asOfM ? 0 : (byMonth[m] || 0);
          const S = Math.min(R, P + Q);
          const T = Math.min(O, Math.max(0, R - S));
          if (R > O + P + Q + 0.0000001) out.overpay++;
          O = Math.max(0, O - T);
          P = Math.max(0, P + Q - S);
        }
        out.principal = O;
        out.unpaid = P;
      }
      let w;
      if (dateNeeded) w = "Date needed";
      else if (t !== "OK") w = "Terms needed: " + t;
      else if (out.badReceipts > 0) w = "Receipt needs review";
      else if (out.overpay > 0) w = "Overpayment — review";
      else w = "Ready";
      out.status = w;
      out.ready = w === "Ready";
      if (!out.ready) {
        if (t !== "OK") out.issues.push(t);
        if (dateNeeded) out.issues.push("A payment needs a date");
        else if (out.badReceipts > 0) {
          model.receipts.forEach(function (r, k) {
            if (ciEq(r.loanId, loan.id) && checks[k].status !== "OK" && checks[k].status !== "Blank" && out.issues.indexOf(checks[k].status) < 0) out.issues.push(checks[k].status);
          });
        }
        if (out.overpay > 0) out.issues.push("Overpayment — review");
      }
      if (!out.ready) { out.principal = null; out.unpaid = 0; }
      return out;
    });
    const receiptsOk = checks.every(function (c) { return c.status === "OK" || c.status === "Blank"; });
    return { results: results, checks: checks, receiptsOk: receiptsOk };
  }

  function computeAll(model) {
    const asOf = model.asOfISO;
    const lc = computeLoans(model);
    const loanResults = lc.results;
    const loansReady = loanResults.every(function (r) { return r.inactive || r.ready; });
    const complete = loansReady && lc.receiptsOk;
    const statusText = complete ? "Ready" : STATUS_INCOMPLETE;
    const sum = function (list, fn) { return list.reduce(function (s, x) { const v = fn(x); return v == null ? s : s + v; }, 0); };

    // Accounts!E = IF(C="","",C*rate)
    const accountsUsd = sum(model.accounts, function (a) { return isNum(a.balance) ? Number(a.balance) * fxRateAccount(model, a.currency) : null; });
    // Properties!K = IF(D="","",(D-E)*rate)
    function propertyEquityUsd(p) {
      if (!isNum(p.value)) return null;
      return (Number(p.value) - (isNum(p.mortgage) ? Number(p.mortgage) : 0)) * fxRate(model, p.currency);
    }
    const equityYes = sum(model.properties, function (p) { return p.include ? propertyEquityUsd(p) : null; });
    const equityAll = sum(model.properties, propertyEquityUsd);
    // Loans!F (debts) = IF(OR(A="",D=""),"",D*rate)
    const debtsUsd = sum(model.debts, function (d) { return (!blankCell(d.name) && isNum(d.balance)) ? Number(d.balance) * fxRate(model, d.currency) : null; });
    const recvPrin = sum(loanResults, function (r) { return r.ready && isNum(r.principal) ? r.principal : null; });
    const unpaid = sum(loanResults, function (r) { return r.ready ? r.unpaid : null; });
    const active = loanResults.filter(function (r) { return !r.inactive; }).length;
    // Home wraps each part in IFERROR(…, 0): a part showing #VALUE! (currency with no rate) counts as 0.
    const z = function (v) { return Number.isFinite(v) ? v : 0; };
    const nw = complete ? (z(accountsUsd) + recvPrin + z(equityAll) - z(debtsUsd)) : null;
    const assets = complete ? (z(accountsUsd) + recvPrin + z(equityAll)) : null;
    const fxErrors = [];
    const noRate = (model.fx || []).filter(function (r) { return fxEffective(r) == null; }).map(function (r) { return r.code; });
    if (!Number.isFinite(accountsUsd)) fxErrors.push("Accounts");
    if (!Number.isFinite(equityAll)) fxErrors.push("Property equity");
    if (!Number.isFinite(debtsUsd)) fxErrors.push("Debts");

    // Cashflow!G: Yearly = IF(OR(C="",D=""),"",C*D); bills: IF(OR(A="",C=""),"",IF(E<>"","",C*rate))
    const yearly = function (r) { return (isNum(r.amount) && isNum(r.pays)) ? Number(r.amount) * Number(r.pays) : null; };
    const incomeYr = sum(model.cashflow.income, function (r) { const y = yearly(r); return y == null ? null : y * fxRate(model, r.currency); });
    const expYr = sum(model.cashflow.expenses, function (r) { const y = yearly(r); return y == null ? null : y * fxRate(model, r.currency); });
    const openBills = sum(model.cashflow.bills, function (r) {
      if (blankCell(r.name) || !isNum(r.amount) || r.paidISO || (r.paidRaw != null && r.paidRaw !== "")) return null;
      return Number(r.amount) * fxRate(model, r.currency);
    });

    return {
      asOfISO: asOf, complete: complete, status: statusText, loans: loanResults, receiptChecks: lc.checks,
      accountsUsd: accountsUsd, equityYes: equityYes, equityAll: equityAll, debtsUsd: debtsUsd,
      recvPrin: complete ? recvPrin : null, unpaid: unpaid, active: active,
      nw: nw, assets: assets, incomeYr: incomeYr, expYr: expYr, openBills: openBills,
      fxErrors: fxErrors, noRate: noRate
    };
  }

  function applyPendingToModel(base, pending) {
    const m = clone(base);
    pending.forEach(function (op) {
      (op.changes || []).forEach(function (ch) { applyChange(m, ch); });
    });
    return m;
  }

  function applyChange(m, ch) {
    const v = ch.value;
    if (ch.entity === "asOf") { m.asOfISO = v; return; }
    if (ch.entity === "receipt") {
      if (ch.action === "add") {
        m.receipts.push({
          row: ch.row, loanId: ch.loanId, dateISO: ch.dateISO, amount: ch.amount,
          currency: ch.currency == null ? "" : ch.currency, notes: ch.notes || "", sheet: ch.sheet, _new: true,
          dateRaw: ch.dateISO ? isoToSerial(ch.dateISO) : null, amountRaw: ch.amount
        });
      } else {
        const r = m.receipts.find(function (x) { return x.row === ch.row && x.sheet === ch.sheet; });
        if (r) {
          if (ch.loanId != null) r.loanId = ch.loanId;
          if (ch.dateISO !== undefined) { r.dateISO = ch.dateISO; r.dateRaw = ch.dateISO ? isoToSerial(ch.dateISO) : null; }
          if (ch.amount !== undefined) { r.amount = ch.amount; r.amountRaw = ch.amount; }
          if (ch.currency != null) r.currency = ch.currency;
          if (ch.notes != null) r.notes = ch.notes;
        }
      }
      return;
    }
    if (ch.entity === "loan") {
      const ln = m.loans.find(function (x) { return x.row === ch.row; });
      if (ln) {
        ["id", "borrower", "purpose", "currency", "opening", "apr", "payments", "freq", "startISO", "notes"].forEach(function (k) {
          if (ch[k] !== undefined) ln[k] = ch[k];
        });
      }
      return;
    }
    if (ch.entity === "account") {
      if (ch.action === "add") m.accounts.push(ch.rowObj);
      else {
        const a = m.accounts.find(function (x) { return x.row === ch.row; });
        if (a) Object.keys(ch.fields || {}).forEach(function (k) { a[k] = ch.fields[k]; });
      }
      return;
    }
    if (ch.entity === "property") {
      if (ch.action === "add") m.properties.push(ch.rowObj);
      else {

      }
      return;
    }
    if (ch.entity === "insurance") {
      if (ch.action === "add") m.insurance.push(ch.rowObj);
      else {
        const a = m.insurance.find(function (x) { return x.row === ch.row; });
        if (a) Object.keys(ch.fields || {}).forEach(function (k) { a[k] = ch.fields[k]; });
      }
      return;
    }
    if (ch.entity === "business") {
      if (ch.action === "add") m.business.push(ch.rowObj);
      else {
        const a = m.business.find(function (x) { return x.row === ch.row; });
        if (a) Object.keys(ch.fields || {}).forEach(function (k) { a[k] = ch.fields[k]; });
      }
      return;
    }
    if (ch.entity === "history") {
      if (ch.action === "add") m.history.push(ch.rowObj);
      else {
        const a = m.history.find(function (x) { return x.row === ch.row; });
        if (a) Object.keys(ch.fields || {}).forEach(function (k) { a[k] = ch.fields[k]; });
      }
      return;
    }
    if (ch.entity === "cashflow") {
      const list = m.cashflow[ch.list] || [];
      if (ch.action === "add") list.push(ch.rowObj);
      else {
        const a = list.find(function (x) { return x.row === ch.row; });
        if (a) Object.keys(ch.fields || {}).forEach(function (k) { a[k] = ch.fields[k]; });
      }
      return;
    }
    if (ch.entity === "fx") {
      if (ch.action === "add") { m.fx.push(Object.assign({ live: null, manual: null, perUsd: null, fallback: null }, ch.rowObj)); m.fx.sort(function (x, y) { return x.row - y.row; }); }
      else {
        const a = m.fx.find(function (x) { return x.row === ch.row; });
        if (a) Object.keys(ch.fields || {}).forEach(function (k) { a[k] = ch.fields[k]; });
      }
      m.fx = m.fx.filter(function (x) { return x.code != null && String(x.code).trim() !== ""; });
      return;
    }
    if (ch.entity === "types") {
      const tc = (m.typeCols || []).find(function (x) { return x.col === ch.list; });
      if (tc) {
        if (ch.action === "add") tc.items.push({ row: ch.row, value: ch.rowObj.value });
        else { const it = tc.items.find(function (x) { return x.row === ch.row; }); if (it) it.value = ch.fields.value; }
        tc.items = tc.items.filter(function (x) { return x.value != null && String(x.value).trim() !== ""; }).sort(function (x, y) { return x.row - y.row; });
      }

  function nextEmptyRow(usedRows, first, last) {
    const set = new Set(usedRows);
    for (let r = first; r <= last; r++) if (!set.has(r)) return r;
    return null;
  }

  function crossCheck(model, computed) {
    const msgs = [];
    const approx = function (a, b) {
      if (!isNum(a) && !isNum(b)) return true;
      if (!isNum(a) || !isNum(b)) return false;
      return Math.abs(Number(a) - Number(b)) < 0.02;
    };
    if (isNum(model.cached.accountsTotal) && !approx(model.cached.accountsTotal, computed.accountsUsd)) {
      msgs.push("Accounts total cached " + money(model.cached.accountsTotal) + " vs computed " + money(computed.accountsUsd));
    }
    if (isNum(model.cached.equityAll) && !approx(model.cached.equityAll, computed.equityAll)) {
      msgs.push("Property equity cached " + money(model.cached.equityAll) + " vs computed " + money(computed.equityAll));
    }
    if (isNum(model.cached.equityInclude) && !approx(model.cached.equityInclude, computed.equityYes)) {
      msgs.push("Included property equity (memo) cached " + money(model.cached.equityInclude) + " vs computed " + money(computed.equityYes));
    }
    if (isNum(model.cached.debtsTotal) && !approx(model.cached.debtsTotal, computed.debtsUsd)) {
      msgs.push("Debts cached " + money(model.cached.debtsTotal) + " vs computed " + money(computed.debtsUsd));
    }
    model.loans.forEach(function (ln, i) {
      const r = computed.loans[i];
      if (!r || r.inactive || !r.ready) return;
      if (isNum(ln.principalCached) && !approx(ln.principalCached, r.principal)) {
        msgs.push(ln.id + " principal cached " + money(ln.principalCached) + " vs computed " + money(r.principal));
      }
      if (isNum(ln.unpaidCached) && !approx(ln.unpaidCached, r.unpaid)) {
        msgs.push(ln.id + " unpaid interest cached " + money(ln.unpaidCached) + " vs computed " + money(r.unpaid));
      }
    });
    const h = model.cached.home || {};
    if (isNum(h.A6) && computed.complete && !approx(h.A6, computed.nw)) {
      msgs.push("Net worth cached " + money(h.A6) + " vs computed " + money(computed.nw));
    }
    const assetsCache = isNum(h.D6) ? h.D6 : h.B10;
    if (isNum(assetsCache) && computed.complete && !approx(assetsCache, computed.assets)) {
      msgs.push("Total assets cached " + money(assetsCache) + " vs computed " + money(computed.assets));
    }
    if (isNum(h.B14) && !approx(h.B14, computed.accountsUsd)) {
      msgs.push("Accounts cached " + money(h.B14) + " vs computed " + money(computed.accountsUsd));
    }
    if (isNum(h.B15) && computed.complete && !approx(h.B15, computed.recvPrin)) {
      msgs.push("Money lent cached " + money(h.B15) + " vs computed " + money(computed.recvPrin));
    }
    if (isNum(h.B16) && !approx(h.B16, computed.equityAll)) {
      msgs.push("Property equity cached " + money(h.B16) + " vs computed " + money(computed.equityAll));
    }
    const debtsCache = isNum(h.B18) ? h.B18 : (isNum(h.G6) ? h.G6 : h.B11);
    if (isNum(debtsCache) && !approx(debtsCache, computed.debtsUsd)) {
      msgs.push("Debts cached " + money(debtsCache) + " vs computed " + money(computed.debtsUsd));
    }
    if (isNum(h.B19) && !approx(h.B19, computed.openBills)) {
      msgs.push("Open bills cached " + money(h.B19) + " vs computed " + money(computed.openBills));
    }
    if (isNum(h.B20) && !approx(h.B20, computed.incomeYr)) {
      msgs.push("Planned income cached " + money(h.B20) + " vs computed " + money(computed.incomeYr));
    }
    if (isNum(h.B21) && !approx(h.B21, computed.expYr)) {
      msgs.push("Planned expenses cached " + money(h.B21) + " vs computed " + money(computed.expYr));
    }
    return msgs;
  }

  /* ---------- surgical XML write ---------- */
  function upsertCellXml(xml, ref, kind, value) {
    const re = new RegExp('<c r="' + ref + '"([^>]*?)\\/>|<c r="' + ref + '"([^>]*)>([\\s\\S]*?)<\\/c>');
    const m = xml.match(re);
    function body(attrs) {
      let a = attrs.replace(/\st="[^"]*"/g, "").replace(/\s*\/$/, "");
      if (kind === "empty") return '<c r="' + ref + '"' + a + "/>";
      if (kind === "n" || kind === "d") return '<c r="' + ref + '"' + a + "><v>" + value + "</v></c>";
      return '<c r="' + ref + '"' + a + ' t="inlineStr"><is><t>' + escapeXml(value == null ? "" : value) + "</t></is></c>";
    }
    if (m) {
      const inner = m[3] || "";
      if (/<f[\s>]/.test(inner) || /<f[\s>]/.test(m[0])) throw new Error("Refusing to overwrite a formula cell " + ref);
      const attrs = m[1] != null ? m[1] : m[2];
      return xml.replace(m[0], body(attrs));
    }
    throw new Error("Cell " + ref + " is not an existing input cell; nothing written.");
  }
  function splitRefSafe(ref) {
    const m = String(ref).match(/^([A-Z]+)(\d+)$/i);
    if (!m) return null;
    return { col: m[1].toUpperCase(), row: +m[2] };
  }

  function cellsFromOp(op) {
    const list = [];
    (op.writes || []).forEach(function (w) { list.push(w); });
    return list;
  }

  async function buildUpdatedXlsx() {
    if (!state.originalAb) throw new Error("No workbook loaded");
    const zip = await JSZip.loadAsync(state.originalAb);
    const byPath = {};
    state.pending.forEach(function (op) {
      cellsFromOp(op).forEach(function (w) {
        const path = state.sheetPaths[w.sheet] || w.path;
        if (!path) throw new Error("Missing sheet path for " + w.sheet);
        if (!byPath[path]) byPath[path] = [];
        byPath[path].push(w);
      });
    });
    const paths = Object.keys(byPath);
    for (let i = 0; i < paths.length; i++) {
      const path = paths[i];
      let xml = await zip.file(path).async("string");
      byPath[path].forEach(function (w) {
        xml = upsertCellXml(xml, w.ref, w.kind, w.value);
      });
      zip.file(path, xml, { createFolders: false });
    }
    let wbXml = await zip.file("xl/workbook.xml").async("string");
    const calc = wbXml.match(/<calcPr\b[^>]*?\/?>/);
    if (calc) {
      if (!/fullCalcOnLoad="1"/.test(calc[0])) {
        const selfClose = /\/>$/.test(calc[0]);
        let attrs = calc[0].replace(/^<calcPr\b/, "").replace(/\/?>$/, "").replace(/\sfullCalcOnLoad="[^"]*"/, "");
        const repl = "<calcPr" + attrs.replace(/\s+$/, "") + ' fullCalcOnLoad="1"' + (selfClose ? "/>" : ">");
        wbXml = wbXml.replace(calc[0], repl);
        zip.file("xl/workbook.xml", wbXml, { createFolders: false });
      }
    } else {
      // calcPr belongs after definedNames / before oleSize etc.; place it right after </sheets> or </definedNames>.
      const anchor = /<\/definedNames>/.test(wbXml) ? "</definedNames>" : "</sheets>";
      wbXml = wbXml.replace(anchor, anchor + '<calcPr fullCalcOnLoad="1"/>');
      zip.file("xl/workbook.xml", wbXml, { createFolders: false });
    }
    return await zip.generateAsync({
      type: "blob",
      mimeType: EXCEL_MIME,
      compression: "DEFLATE"
    });
  }

  async function persist() {
    try {
      await idbSet("fileName", state.fileName);
      await idbSet("fileDate", state.fileDate ? state.fileDate.valueOf() : null);
      await idbSet("pending", state.pending);
      if (state.originalAb) await idbSet("file", state.originalAb);

  }

  function lq(key) { return (state.listQuery && state.listQuery[key]) || ""; }
  function ls(key, fallback) { return (state.listSort && state.listSort[key]) || fallback; }
  function lg(key) { return !!(state.listGroup && state.listGroup[key]); }
  function lshown(key) { return (state.listShown && state.listShown[key]) || 60; }
  function listToolbar(key, opts) {
    opts = opts || {};

    let html = '<div class="list-toolbar">';
    html += '<input class="search" data-role="search" data-key="' + key + '" placeholder="' +

      html += '<select class="list-sort" data-role="list-sort" data-key="' + key + '">';
      opts.sorts.forEach(function (s) {
        html += '<option value="' + s.id + '"' + (sort === s.id ? " selected" : "") + ">" + escapeHtml(s.label) + "</option>";
      });
      html += "</select>";
    }
    if (opts.groupLabel) {
      html += '<button type="button" class="pill ' + (lg(key) ? "navy" : "ghost") + '" data-act="group-toggle" data-key="' + key + '">' +
        escapeHtml(opts.groupLabel) + "</button>";

    html += "</div>";

  function pageSlice(arr, key) {
    const n = lshown(key);
    return { rows: arr.slice(0, n), more: arr.length > n, hidden: Math.max(0, arr.length - n), total: arr.length };
  }

  function render() {
    applyTheme();
    const app = $("#app");
    if (!state.ready || !state.parsed) {
      app.innerHTML = renderWelcome();
      bind();
      return;
    }
    const model = liveModel();
    const comp = computeAll(model);
    state.computed = comp;
    let body = "";
    if (state.view === "home") body = renderHome(model, comp);
    else if (state.view === "loans") body = renderLoans(model, comp);
    else if (state.view === "receipts") body = renderReceipts(model, comp);
    else if (state.view === "assets") body = renderAssets(model, comp);
    else body = renderMore(model, comp);
    const fab = fabFor(state.view);
    app.innerHTML = body + renderTabs() + fab +
      '<div id="overlay"></div><div id="sheet"></div>';
    bind();
  }

  function renderAssets(model, comp) {
    const q = lq("assets").trim().toLowerCase();
    const sort = ls("assets", "name");
    function filt(list, nameFn, extra) {
      let rows = list.slice();
      if (q) rows = rows.filter(function (r) {
        return nameFn(r).toLowerCase().indexOf(q) >= 0 || (extra && extra(r));
      });
      return rows;
    }
    let accounts = filt(model.accounts, function (a) { return (a.name || "") + " " + (a.type || ""); });
    let properties = filt(model.properties, function (p) { return (p.name || "") + " " + (p.location || ""); });
    const amt = function (r, usd) { return isNum(usd) ? Number(usd) : -Infinity; };
    if (sort === "amount-desc" || sort === "amount-asc") {
      const dir = sort === "amount-desc" ? -1 : 1;
      accounts.sort(function (a, b) {
        const ua = isNum(a.balance) ? Number(a.balance) * fxRateAccount(model, a.currency) : 0;
        const ub = isNum(b.balance) ? Number(b.balance) * fxRateAccount(model, b.currency) : 0;
        return ((ua || 0) - (ub || 0)) * dir;
      });
      properties.sort(function (a, b) {
        const ea = isNum(a.value) ? (Number(a.value) - (a.mortgage || 0)) * fxRate(model, a.currency) : 0;
        const eb = isNum(b.value) ? (Number(b.value) - (b.mortgage || 0)) * fxRate(model, b.currency) : 0;
        return (ea - eb) * dir;
      });
    } else {
      accounts.sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
      properties.sort(function (a, b) { return (a.name || "").localeCompare(b.name || ""); });
    }
    let html = headerBar("Assets", "Accounts & property") + '<div id="views" class="view" data-testid="screen-assets">';
    html += listToolbar("assets", {
      placeholder: "Search accounts and property",
      sorts: [

        { id: "amount-desc", label: "Amount, high to low" },
        { id: "amount-asc", label: "Amount, low to high" }
      ],
      summary: "Accounts " + money(comp.accountsUsd) + " · Property equity " + money(comp.equityAll)
    });
    html += '<div class="section-label">Accounts · ' + accounts.length + "</div>";
    if (!accounts.length) html += emptyState(q ? "No matching accounts" : "No accounts yet", q ? "Try a different search." : "Add a bank or cash balance.", q ? "" : "add-account", q ? "" : "Add a balance");
    else {

      html += '<div class="list-card">';
      page.rows.forEach(function (a) {
        const usd = isNum(a.balance) ? Number(a.balance) * fxRateAccount(model, a.currency) : null;
        const nonUsd = curCode(a.currency) !== "USD";
        html += '<button class="row" data-act="edit-account" data-row="' + a.row + '"><div class="body"><div class="title">' +
          escapeHtml(a.name || a.type || "Account") + '</div><div class="meta">' + escapeHtml([a.type, nonUsd ? moneyCur(a.balance, a.currency) : ""].filter(Boolean).join(" · ")) +
          "</div></div><div class=\"right " + moneyClass(usd) + '">' + money(usd) + "</div>" + svg("chev", 18) + "</button>";
      });
      html += "</div>" + showMoreBtn("accounts", page);

    html += '<div class="section-label">Properties · ' + properties.length + "</div>";
    if (!properties.length) html += emptyState(q ? "No matching properties" : "No properties yet", q ? "Try a different search." : "Add a home or other property.", q ? "" : "add-property", q ? "" : "Add a property");
    else {

          "Include (memo): " + (pr.include ? "Yes" : (pr.includeRaw ? escapeHtml(pr.includeRaw) : "blank")) +
          "</div></div><div class=\"right " + moneyClass(eq) + '">' + money(eq) + "</div>" + svg("chev", 18) + "</button>";
      });
      html += "</div>" + showMoreBtn("properties", page);
    }

    return html;

  function renderHistory(model, comp) {

  function histNet(r) {
    if (isNum(r.nw)) return Number(r.nw);
    if (isNum(r.assets) || isNum(r.debts)) return Number(r.assets || 0) - Number(r.debts || 0);
    return null;
  }
  function historyPoints(model) {
    return (model.history || []).filter(function (r) {
      return r.dateISO && isNum(histNet(r));
    }).slice().sort(function (a, b) { return String(a.dateISO).localeCompare(String(b.dateISO)); });
  }
  function fmtChartDate(iso) {
    if (!iso) return "—";
    const p = String(iso).split("-").map(Number);
    if (!p[0] || !p[1] || !p[2]) return String(iso);
    const dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return dt.toLocaleDateString("en-US", { timeZone: "UTC", month: "short", day: "numeric", year: "numeric" });
  }
  function trendSvg(vals, gid) {
    const w = 320, h = 140, padX = 6, padY = 16;
    if (!vals.length) return "";
    const min0 = Math.min.apply(null, vals), max0 = Math.max.apply(null, vals);
    const span = max0 - min0;
    const min = span === 0 ? min0 - 1 : min0 - span * 0.08;
    const max = span === 0 ? max0 + 1 : max0 + span * 0.08;
    const coords = vals.map(function (v, i) {
      const x = padX + (i * (w - 2 * padX) / Math.max(1, vals.length - 1));
      const y = padY + (1 - (v - min) / (max - min)) * (h - 2 * padY);
      return { x: x, y: y };
    });
    const line = coords.map(function (pt, i) {
      return (i ? "L" : "M") + pt.x.toFixed(2) + " " + pt.y.toFixed(2);
    }).join(" ");
    const last = coords[coords.length - 1];
    const area = line + " L" + last.x.toFixed(2) + " " + (h - 2) + " L" + coords[0].x.toFixed(2) + " " + (h - 2) + " Z";
    let grid = "";
    for (let i = 1; i <= 3; i++) {
      const y = (padY + i * (h - 2 * padY) / 4).toFixed(1);
      grid += '<line x1="' + padX + '" x2="' + (w - padX) + '" y1="' + y + '" y2="' + y + '" stroke="var(--sep)" stroke-width="1"/>';
    }
    return '<svg class="trend chart" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--chart-stroke)" stop-opacity="0.34"/>' +
      '<stop offset="100%" stop-color="var(--chart-stroke)" stop-opacity="0"/>' +
      "</linearGradient></defs>" + grid +
      '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--chart-stroke)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + last.x.toFixed(2) + '" cy="' + last.y.toFixed(2) + '" r="4" fill="var(--chart-stroke)" stroke="var(--bg-elev)" stroke-width="2"/>' +
      "</svg>";
  }
  function renderNwChart(model) {
    const pts = historyPoints(model);
    if (pts.length < 2) {
      return '<button type="button" class="nw-chart" data-act="goto-history" data-testid="nw-chart">' +
        '<div class="chart-kicker">Net worth trend</div>' +
        '<div class="chart-empty" data-testid="nw-chart-empty">Add a History snapshot to see your trend</div>' +
        "</button>";
    }
    const vals = pts.map(histNet);
    const last = vals[vals.length - 1];
    const prev = vals[vals.length - 2];
    const delta = last - prev;
    const dir = delta > 0.005 ? "up" : (delta < -0.005 ? "down" : "flat");
    const pct = isNum(prev) && Number(prev) !== 0 ? (delta / Math.abs(Number(prev)) * 100) : null;
    const arrow = dir === "up" ? "▲ " : (dir === "down" ? "▼ " : "");
    const chg = arrow + (delta > 0 ? "+" : "") + money(delta) +
      (pct != null ? " · " + (pct > 0 ? "+" : "") + pct.toFixed(1) + "%" : "") +
      " vs " + fmtChartDate(pts[pts.length - 2].dateISO);
    return '<button type="button" class="nw-chart ' + dir + '" data-act="goto-history" data-testid="nw-chart">' +
      '<div class="chart-head"><div class="chart-kicker">Net worth trend</div>' +
      '<div class="chart-latest" data-testid="nw-chart-latest">' + escapeHtml(money(last)) + "</div></div>" +
      '<div class="chart-change ' + dir + '" data-testid="nw-chart-delta">' + escapeHtml(chg) + "</div>" +
      trendSvg(vals, "nwGradHome") +
      '<div class="chart-axis"><span>' + escapeHtml(fmtChartDate(pts[0].dateISO)) + "</span><span>" +
      escapeHtml(fmtChartDate(pts[pts.length - 1].dateISO)) + "</span></div>" +
      "</button>";
  }
  function sparkline(rows) {
    const pts = rows.slice().sort(function (a, b) { return a.dateISO.localeCompare(b.dateISO); });
    const vals = pts.map(histNet);
    return trendSvg(vals, "nwGradHist");
  }

  function renderFx(model) {
