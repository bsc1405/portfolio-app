  /* ---------- forms ---------- */
  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fieldHtml(f, val) {
    const id = "f_" + f.key;
    const v = val == null ? "" : val;
    let input;
    if (f.type === "select") {
      let options = (f.options || []).slice();
      if (v !== "" && !options.some(function (o) { return String(o) === String(v); })) options.push(String(v));
      input = '<select id="' + id + '" name="' + f.key + '">' + (f.blank !== false ? '<option value="">' + escapeHtml(f.blankLabel || "") + '</option>' : "") +
        options.map(function (o) { return '<option value="' + escapeHtml(o) + '"' + (String(o) === String(v) ? " selected" : "") + ">" + escapeHtml(o) + "</option>"; }).join("") +
        "</select>";
    } else if (f.type === "textarea") {
      input = '<textarea id="' + id + '" name="' + f.key + '">' + escapeHtml(v) + "</textarea>";
    } else {
      const t = f.type === "date" ? "date" : (f.type === "email" ? "email" : "text");
      const mode = (f.type === "money" || f.type === "number" || f.type === "percent") ? ' inputmode="decimal"' : "";
      input = '<input id="' + id + '" name="' + f.key + '" type="' + t + '"' + mode + ' value="' + escapeHtml(v) + '"' +
        (f.placeholder ? ' placeholder="' + escapeHtml(f.placeholder) + '"' : "") + ' autocomplete="off">';
    }
    return '<div class="field" data-field="' + f.key + '"><label for="' + id + '">' + escapeHtml(f.label) + (f.required ? " *" : "") + "</label>" + input +
      (f.hint ? '<div class="hint">' + escapeHtml(f.hint) + "</div>" : "") +
      (f.fxHint ? '<div class="hint fx-hint" data-role="fxhint"></div>' : "") + '<div class="err" hidden></div></div>';
  }
  function formSheet(title, fields, values, opts) {
    opts = opts || {};
    return '<div class="sheet-handle"></div><div class="sheet-head"><button class="pill ghost" data-act="close-sheet">Cancel</button><h2>' +
      escapeHtml(title) + '</h2><span style="width:64px"></span></div><form class="sheet-body" data-form="' + escapeHtml(opts.form || "") + '" novalidate>' +
      (opts.intro ? '<div class="banner info">' + escapeHtml(opts.intro) + "</div>" : "") +
      fields.map(function (f) { return fieldHtml(f, values ? values[f.key] : ""); }).join("") +
      '<div class="banner amber" data-role="warn" hidden></div>' +
      '<div class="sheet-actions"><button type="submit" class="btn" data-testid="form-save">' + escapeHtml(opts.submit || "Save") + "</button></div></form>";
  }
  function readForm(form, fields) {
    const out = {};
    fields.forEach(function (f) {
      const el = form.querySelector('[name="' + f.key + '"]');
      out[f.key] = el ? String(el.value).trim() : "";
    });
    return out;
  }
  function showErrors(form, errs) {
    form.querySelectorAll(".err").forEach(function (e) { e.hidden = true; e.textContent = ""; });
    Object.keys(errs).forEach(function (k) {
      const box = form.querySelector('[data-field="' + k + '"] .err');
      if (box) { box.hidden = false; box.textContent = errs[k]; }
    });
  }
  function parseMoney(s) {
    if (s === "" || s == null) return null;
    const n = Number(String(s).replace(/[$,\s]/g, ""));
    return isFinite(n) ? n : NaN;
  }

  /* Dropdown choices read from the workbook's own Data Validation lists. */
  function dvFor(sheetName, col, row) {
    const all = (state.parsed && state.parsed._dv) || {};
    const key = Object.keys(all).find(function (k) { return k.toLowerCase() === String(sheetName || "").toLowerCase(); });
    const list = key ? all[key] : [];
    const c = colNum(col);
    return list.find(function (d) {
      return d.ranges.some(function (r) { return c >= r.c1 && c <= r.c2 && row >= r.r1 && row <= r.r2; });
    }) || null;
  }
  function dvOptions(model, sheetName, col, row, fallback) {
    const d = sheetName && col && row ? dvFor(sheetName, col, row) : null;
    if (!d) return fallback || [];
    const src = d.src;
    if (src.list) return src.list.slice();
    const sn = String(src.sheet).toLowerCase();
    if (model.fxRange && sn === String(model.fxRange.sheet).toLowerCase() && src.col === "A") {
      return model.fx.filter(function (x) { return x.row >= src.r1 && x.row <= src.r2; }).map(function (x) { return String(x.code); });
    }
    if (model.typesSheet && sn === String(model.typesSheet).toLowerCase()) {
      const tc = (model.typeCols || []).find(function (x) { return x.col === src.col; });
      if (tc) return tc.items.filter(function (x) { return x.row >= src.r1 && x.row <= src.r2; }).map(function (x) { return x.value; });
    }
    const out = [];
    const raw = state.raw && Object.keys(state.raw).find(function (k) { return k.toLowerCase() === sn; });
    for (let r = src.r1; r <= src.r2; r++) {
      const cc = raw ? state.raw[raw].cells[src.col + r] : null;
      if (cc && cc.v != null && String(cc.v).trim() !== "") out.push(String(cc.v));
    }
    return out;
  }
  function fxCodes(model) { return model.fx.map(function (x) { return x.code; }); }
  function curField(model, sheet, col, row, extra) {
    return Object.assign({ key: "currency", label: "Currency", type: "select", options: dvOptions(model, sheet, col, row, fxCodes(model)),
      blankLabel: "(blank = USD)", col: col, kind: "s", fxHint: true }, extra || {});
  }
  function updateFxHint(form) {
    const box = form && form.querySelector('[data-role="fxhint"]');
    if (!box) return;
    const model = liveModel();
    const cur = (form.querySelector('[name="currency"]') || {}).value || "";
    const st = state.sheet || {};
    const g = function (k) { const el = form.querySelector('[name="' + k + '"]'); return el ? parseMoney(el.value) : null; };
    let amt = null;
    if (st.gkind === "property") { const v = g("value"); amt = v == null || Number.isNaN(v) ? null : v - (g("mortgage") || 0); }
    else amt = g("balance") != null ? g("balance") : g("amount") != null ? g("amount") : g("opening");
    const code = curCode(cur);
    const rate = st.gkind === "account" ? fxRateAccount(model, cur) : fxRate(model, cur);
    let txt = "";
    if (code !== "USD" || !Number.isFinite(rate) || rate !== 1) {
      const row = fxRow(model, code);
      if (!row && code !== "USD") txt = code + " is not on the FX sheet — Excel counts it 1:1 as USD.";
      else if (!Number.isFinite(rate)) txt = "No rate for " + code + " on the FX sheet yet — Excel totals show an error until you add one (More → Currencies).";
      else txt = "1 " + code + " = " + Number(rate).toPrecision(6) + " USD" + (amt != null && !Number.isNaN(amt) ? " · " + moneyCur(amt, code) + " ≈ " + money(amt * rate) : "");
    }
    if (st.kind === "loan" && code !== "USD") txt = "Excel's interest sheet works in USD only. With " + code + " this loan shows “Terms needed: USD only” and Home waits — exactly like Excel.";
    if (st.kind === "receipt" && code !== "USD") txt = "Excel needs USD payments that match the loan. " + code + " shows “USD receipt required” and Home waits — exactly like Excel.";
    box.textContent = txt;
    box.hidden = !txt;
  }

  function rawCell(sheetName, ref) {
    const raw = state.raw && state.raw[sheetName];
    return raw ? raw.cells[ref] : null;
  }
  function assertInput(sheetName, ref) {
    const c = rawCell(sheetName, ref);
    if (!c) throw new Error(sheetName + "!" + ref + " is not an input cell in this workbook.");
    if (c.f) throw new Error(sheetName + "!" + ref + " is a formula cell.");
    const unlocked = new Set(state.parsed._unlocked || []);
    if (c.s == null || !unlocked.has(Number(c.s))) throw new Error(sheetName + "!" + ref + " is locked.");
  }
  function w(sheet, ref, kind, value) {
    assertInput(sheet, ref);
    return { sheet: sheet, ref: ref, kind: kind, value: value };
  }
  function wText(sheet, ref, v) { return v === "" || v == null ? w(sheet, ref, "empty") : w(sheet, ref, "s", v); }
  function wNum(sheet, ref, v) { return v === "" || v == null || Number.isNaN(v) ? w(sheet, ref, "empty") : w(sheet, ref, "n", String(v)); }
  function wDate(sheet, ref, iso) { return iso ? w(sheet, ref, "n", String(isoToSerial(iso))) : w(sheet, ref, "empty"); }

  function pushOp(label, changes, writes) {
    state.pending.push({ id: uid(), label: label, changes: changes, writes: writes, at: Date.now() });
    persist();
    haptic(15);
    closeSheet();
    render();
    toast(label);
  }

  function toast(msg) {
    let t = document.getElementById("toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "toast";
      t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--safe-bot) + 84px);background:rgba(28,28,30,0.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;transition:opacity .25s;max-width:86vw;text-align:center";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = "1";
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.style.opacity = "0"; }, 2200);
  }

  function loanIds(model) {
    return model.loans.filter(function (l) { return l.id; }).map(function (l) { return l.id; });
  }

  /* Receipt */
  function receiptFields(model) {
    const rr = model.receiptRange || {};
    return [
      { key: "loanId", label: "Loan", type: "select", options: loanIds(model), required: true },
      { key: "date", label: "Date received", type: "date", required: true },
      { key: "amount", label: "Amount", type: "money", required: true, placeholder: "0.00" },
      curField(model, rr.sheet, rr.cols && rr.cols.currency, rr.first, { blankLabel: "" }),
      { key: "notes", label: "Note", type: "text" }
    ];
  }
  function openReceiptForm(row) {
    const model = liveModel();
    const existing = row ? model.receipts.find(function (r) { return r.row === row; }) : null;
    const vals = existing ? {
      loanId: existing.loanId, date: existing.dateISO || "", amount: existing.amount != null ? existing.amount : "",
      currency: existing.currency || "", notes: existing.notes
    } : { loanId: loanIds(model)[0] || "", date: todayISO(), currency: "USD" };
    state.sheet = { kind: "receipt", row: row || null, fields: receiptFields(model), confirmFuture: false };
    openSheet(formSheet(existing ? "Edit payment" : "Add payment received", state.sheet.fields, vals, {
      form: "receipt", submit: existing ? "Save changes" : "Add payment",
      intro: existing && !existing.dateISO ? "This receipt has no date. Enter the actual date it was received." : ""
    }));
    updateFxHint(document.querySelector("#sheet form"));
  }
  function submitReceipt(form) {
    const model = liveModel();
    const f = readForm(form, state.sheet.fields);
    const errs = {};
    if (!f.loanId) errs.loanId = "Choose a loan.";
    else if (loanIds(model).indexOf(f.loanId) < 0) errs.loanId = "Unknown loan ID.";
    const amt = parseMoney(f.amount);
    if (amt == null || Number.isNaN(amt)) errs.amount = "Enter an amount.";
    else if (amt <= 0) errs.amount = "Amount must be positive.";
    if (!f.date) errs.date = "Date is required (blank makes Home incomplete).";
    if (Object.keys(errs).length) { showErrors(form, errs); return; }
    const asOf = model.asOfISO;
    const futureVs = (asOf && f.date > asOf) ? "the as-of date (" + asOf + ")" : (f.date > todayISO() ? "today" : "");
    if (futureVs && !state.sheet.confirmFuture) {
      const warn = form.querySelector('[data-role="warn"]');
      warn.hidden = false;
      warn.textContent = "This date is after " + futureVs + ". Excel flags future receipts and leaves them out of totals until the as-of date passes. Tap again to save anyway.";
      state.sheet.confirmFuture = true;
      return;
    }
    const rr = model.receiptRange;
    const sheet = rr.sheet;
    const c = rr.cols;
    let row = state.sheet.row;
    if (!row) {
      row = nextEmptyRow(model.receipts.map(function (r) { return r.row; }), rr.first, rr.last);
      if (!row) { showErrors(form, { amount: "Receipt log is full (3,000 rows)." }); return; }
    }
    try {
      const prev = state.sheet.row ? model.receipts.find(function (r) { return r.row === row; }) : null;
      const writes = [];
      if (!prev || prev.loanId !== f.loanId) writes.push(wText(sheet, c.id + row, f.loanId));
      if (!prev || prev.dateISO !== f.date) writes.push(wDate(sheet, c.date + row, f.date));
      if (!prev || prev.amount !== amt) writes.push(wNum(sheet, c.amount + row, amt));
      if (!prev || (prev.currency || "") !== (f.currency || "")) writes.push(wText(sheet, c.currency + row, f.currency || ""));
      if ((!prev && f.notes) || (prev && (prev.notes || "") !== f.notes)) writes.push(wText(sheet, c.notes + row, f.notes));
      if (!writes.length) { closeSheet(); toast("No changes"); return; }
      const change = state.sheet.row
        ? { entity: "receipt", row: row, sheet: sheet, loanId: f.loanId, dateISO: f.date, amount: amt, currency: f.currency || "", notes: f.notes }
        : { entity: "receipt", action: "add", row: row, sheet: sheet, loanId: f.loanId, dateISO: f.date, amount: amt, currency: f.currency || "", notes: f.notes };
      pushOp((state.sheet.row ? "Updated payment " : "Payment ") + money(amt) + " · " + f.loanId + " (row " + row + ")", [change], writes);
    } catch (e) { showErrors(form, { amount: e.message }); }
  }

  /* Loan */
  function loanFields(model, row) {
    const sheet = model.loans[0] && model.loans[0].sheet;
    const c = (model.loans[0] && model.loans[0].cols) || {};
    return [
    { key: "id", label: "Loan ID", type: "text", required: true },
    { key: "borrower", label: "Borrower", type: "text" },
    { key: "purpose", label: "Purpose", type: "select", options: dvOptions(model, sheet, c.purpose || "C", row || 6, model.types["loans / purpose"] || []) },
    curField(model, sheet, c.currency || "D", row || 6, { blankLabel: "" }),
    { key: "opening", label: "Opening principal", type: "money", required: true },
    { key: "apr", label: "APR %", type: "percent", required: true, hint: "Type 4 for 4%. Explicit 0 is allowed; blank is not zero." },
    { key: "payments", label: "Number of payments", type: "number", required: true, hint: "1–360" },
    { key: "freq", label: "Frequency", type: "select", options: ["Monthly"], blank: false },
    { key: "start", label: "First payment month (start date)", type: "date", required: true },
    { key: "notes", label: "Notes", type: "text" }
  ];
  }
  function openLoanForm(row) {
    const model = liveModel();
    let ln = row ? model.loans.find(function (l) { return l.row === row; }) : null;
    if (!ln) ln = model.loans.find(function (l) { return !l.id; });
    if (!ln) { toast("All 25 loan slots are used."); return; }
    const vals = {
      id: ln.id, borrower: ln.borrower, purpose: ln.purpose, currency: ln.currency || "USD",
      opening: ln.opening != null ? ln.opening : "", apr: isNum(ln.apr) ? +(Number(ln.apr) * 100).toFixed(6) : "",
      payments: ln.payments != null ? ln.payments : "", freq: ln.freq || "Monthly", start: ln.startISO || "", notes: ln.notes || ""
    };
    if (!ln.id) vals.currency = "USD";
    const LOAN_FIELDS = loanFields(model, ln.row);
    state.sheet = { kind: "loan", row: ln.row, fields: LOAN_FIELDS, isNew: !ln.id };
    const comp = computeAll(model);
    const r = comp.loans.find(function (x) { return x.id && x.id === ln.id; });
    const intro = r && !r.ready && r.issues && r.issues.length ? "Needs: " + r.issues.join(", ") : "";
    openSheet(formSheet(ln.id ? "Edit loan " + ln.id : "Add loan", LOAN_FIELDS, vals, { form: "loan", submit: ln.id ? "Save loan" : "Add loan", intro: intro }) +
      (ln.id ? '<div class="sheet-body"><button class="btn secondary" data-act="add-receipt-for" data-id="' + escapeHtml(ln.id) + '">Add payment for ' + escapeHtml(ln.id) + "</button></div>" : ""));
    updateFxHint(document.querySelector("#sheet form"));
  }
  function submitLoan(form) {
    const model = liveModel();
    const f = readForm(form, state.sheet.fields);
    const errs = {};
    const ln = model.loans.find(function (l) { return l.row === state.sheet.row; });
    if (!f.id) errs.id = "Loan ID is required.";
    else if (/[*?~]/.test(f.id)) errs.id = "Avoid * ? ~ in IDs.";
    else if (model.loans.some(function (l) { return l.row !== ln.row && l.id && l.id.toLowerCase() === f.id.toLowerCase(); })) errs.id = "That Loan ID already exists.";
    const op = parseMoney(f.opening);
    if (op == null || Number.isNaN(op)) errs.opening = "Enter the opening principal.";
    else if (op < 0) errs.opening = "Cannot be negative.";
    const apr = f.apr === "" ? null : Number(String(f.apr).replace(/%/g, "")) / 100;
    if (apr == null || Number.isNaN(apr)) errs.apr = "Enter an APR (0 is allowed).";
    else if (apr < 0) errs.apr = "Cannot be negative.";
    const n = f.payments === "" ? null : Number(f.payments);
    if (n == null || !Number.isInteger(n) || n < 1 || n > 360) errs.payments = "Whole number 1–360.";
    if (!f.start) errs.start = "Start date is required.";
    if (Object.keys(errs).length) { showErrors(form, errs); return; }
    if (ln.id && f.id !== ln.id && model.receipts.some(function (r) { return r.loanId === ln.id; })) {
      showErrors(form, { id: "Receipts use " + ln.id + ". Keep the same ID or update those receipts first." });
      return;
    }
    const sheet = ln.sheet;
    const c = ln.cols;
    const r = ln.row;
    try {
      const same = function (a, b) {
        if ((a == null || a === "") && (b == null || b === "")) return true;
        if (isNum(a) && isNum(b)) return Math.abs(Number(a) - Number(b)) < 1e-12;
        return String(a) === String(b);
      };
      const writes = [];
      if (!same(ln.id, f.id)) writes.push(wText(sheet, c.id + r, f.id));
      if (!same(ln.borrower, f.borrower)) writes.push(wText(sheet, c.borrower + r, f.borrower));
      if (!same(ln.purpose, f.purpose)) writes.push(wText(sheet, c.purpose + r, f.purpose));
      if (!same(ln.currency, f.currency)) writes.push(wText(sheet, c.currency + r, f.currency));
      if (!same(ln.opening, op)) writes.push(wNum(sheet, c.opening + r, op));
      if (!same(ln.apr, apr)) writes.push(wNum(sheet, c.apr + r, apr));
      if (!same(ln.payments, n)) writes.push(wNum(sheet, c.payments + r, n));
      if (!same(ln.freq, f.freq || "Monthly")) writes.push(wText(sheet, c.freq + r, f.freq || "Monthly"));
      if (!same(ln.startISO, f.start)) writes.push(wDate(sheet, c.start + r, f.start));
      if (!same(ln.notes, f.notes)) writes.push(wText(sheet, (c.notes || "L") + r, f.notes));
      if (!writes.length) { closeSheet(); toast("No changes"); return; }
      pushOp((ln.id ? "Updated loan " : "Added loan ") + f.id, [{
        entity: "loan", row: r, id: f.id, borrower: f.borrower, purpose: f.purpose, currency: f.currency,
        opening: op, apr: apr, payments: n, freq: f.freq || "Monthly", startISO: f.start, notes: f.notes
      }], writes);
    } catch (e) { showErrors(form, { id: e.message }); }
  }

  function openGeneric(kind, row, list) {
    const model = liveModel();
    const spec = genericSpec(kind, model, list);
    if (!spec || !spec.range || !spec.range.sheet) { toast("This section is not in the workbook."); return; }
    let item = row ? spec.list.find(function (x) { return x.row === row; }) : null;
    let targetRow = row;
    if (!item) {
      if (spec.noAdd) return;
      targetRow = nextEmptyRow(spec.list.map(function (x) { return x.row; }), spec.range.first, spec.range.last);
      if (!targetRow) { toast("No empty rows left in this section."); return; }
    }
    const vals = {};
    spec.fields.forEach(function (f) {
      let v = item ? item[f.key] : "";
      if (f.kind === "pct" && isNum(v)) v = +(Number(v) * 100).toFixed(6);
      vals[f.key] = v == null ? "" : v;
    });
    if (!item) {
      spec.fields.forEach(function (f) { if (f.key === "currency") vals.currency = "USD"; if (f.key === "includeRaw") vals.includeRaw = "Yes"; });
      if (kind === "cashflow" && list !== "bills") vals.pays = 12;
    }
    state.sheet = { kind: "generic", gkind: kind, list: list, row: targetRow, isNew: !item, fields: spec.fields };
    openSheet(formSheet((item ? "Edit " : "Add ") + spec.title.toLowerCase(), spec.fields, vals, { form: "generic", submit: item ? "Save" : "Add", intro: spec.intro || "" }));
    updateFxHint(document.querySelector("#sheet form"));
  }

  function submitGeneric(form) {
    const model = liveModel();
    const st = state.sheet;
    const spec = genericSpec(st.gkind, model, st.list);
    const f = readForm(form, spec.fields);
    const errs = {};
    const item = st.isNew ? null : spec.list.find(function (x) { return x.row === st.row; });
    const fields = {};
    const writes = [];
    const sheet = spec.range.sheet;
    try {
      spec.fields.forEach(function (fd) {
        const raw = f[fd.key];
        if (fd.required && raw === "") { errs[fd.key] = "Required."; return; }
        let val;
        if (fd.kind === "n" || fd.kind === "pct") {
          val = raw === "" ? null : (fd.type === "money" ? parseMoney(raw) : Number(raw));
          if (raw !== "" && (val == null || Number.isNaN(val))) { errs[fd.key] = "Enter a number."; return; }
          if (fd.type === "money" && val != null && val < 0) { errs[fd.key] = "Cannot be negative."; return; }
          if (fd.kind === "pct" && val != null) val = val / 100;
        } else if (fd.kind === "d") {
          val = raw || null;
        } else {
          val = fd.upper ? raw.toUpperCase() : raw;
        }
        if (spec.entity === "fx" && fd.key === "code" && val && spec.list.some(function (x) { return x.row !== st.row && String(x.code).toUpperCase() === val; })) {
          errs.code = val + " is already on the FX sheet."; return;
        }
        if (spec.entity === "fx" && fd.key === "perUsd" && val != null && val < 0) { errs.perUsd = "Cannot be negative."; return; }
        const before = item ? item[fd.key] : (fd.kind === "s" ? "" : null);
        const same = (before == null || before === "") && (val == null || val === "") ? true :
          (fd.kind === "n" || fd.kind === "pct") ? (isNum(before) && isNum(val) && Math.abs(Number(before) - Number(val)) < 1e-9) :
          String(before) === String(val);
        fields[fd.key] = val;
        if (!same || st.isNew) {
          const ref = fd.col + st.row;
          if (val == null || val === "") { if (item) writes.push(w(sheet, ref, "empty")); }
          else if (fd.kind === "n" || fd.kind === "pct") writes.push(w(sheet, ref, "n", String(val)));
          else if (fd.kind === "d") writes.push(w(sheet, ref, "n", String(isoToSerial(val))));
          else writes.push(w(sheet, ref, "s", val));
        }
      });
    } catch (e) { errs[spec.fields[0].key] = e.message; }
    if (Object.keys(errs).length) { showErrors(form, errs); return; }
    if (!writes.length) { closeSheet(); toast("No changes"); return; }
    if (spec.entity === "property") fields.include = String(fields.includeRaw || "").trim().toLowerCase() === "yes";
    if (spec.entity === "property" && fields.mortgage == null) fields.mortgage = 0;
    if (spec.entity === "history" && !isNum(fields.nw) && (isNum(fields.assets) || isNum(fields.debts))) {
      fields.nw = Number(fields.assets || 0) - Number(fields.debts || 0);
    }
    let change;
    if (st.isNew) {
      const rowObj = Object.assign({ row: st.row, sheet: sheet }, fields);
      change = { entity: spec.entity, action: "add", row: st.row, rowObj: rowObj, list: spec.listName };
    } else {
      change = { entity: spec.entity, action: "edit", row: st.row, fields: fields, list: spec.listName };
    }
    const nm = fields.name || fields.code || fields.value || "";
    const label = (st.isNew ? "Added " : "Updated ") + spec.title.toLowerCase() + (nm ? " " + nm : "") + " (row " + st.row + ")";
    pushOp(label, [change], writes);
  }

  async function saveExcel() {
    if (!state.pending.length) { toast("Nothing to save yet"); return; }
    try {
      const blob = await buildUpdatedXlsx();
      const name = state.fileName && /\.xlsx$/i.test(state.fileName) ? state.fileName : "Portfolio-Mobile.xlsx";
      const file = new File([blob], name, { type: EXCEL_MIME });
      let shared = false;
      if (navigator.canShare && navigator.share) {
        try {
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: name });
            shared = true;
          }
        } catch (e) {
          if (e && e.name === "AbortError") { toast("Share canceled"); return; }
        }
      }
      if (!shared) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      }
      // Continue from the exported package so further edits stack on it.
      state.originalAb = await blob.arrayBuffer();
      state.fileDate = new Date();
      await loadArrayBuffer(state.originalAb, name, state.fileDate, { keepView: true, exported: true });
      state.pending = [];
      await persist();
      closeSheet();
      render();
      toast("Saved " + name + " — open it in Excel to recalculate");
    } catch (e) {
      console.error(e);
      toast("Save failed: " + e.message);
    }
  }

  async function loadArrayBuffer(ab, name, date, opts) {
    opts = opts || {};
    const parsed = await parseWorkbook(ab);
    state.raw = parsed._raw || {};
    state.parsed = parsed;
    state.sheetPaths = parsed._sheetPaths;
    state.originalAb = ab;
    state.fileName = name || "Portfolio.xlsx";
    state.fileDate = date || new Date();
    state.ready = true;
    state.exported = !!opts.exported;
    const comp = computeAll(parsed);
    state.mismatch = state.exported ? [] : crossCheck(parsed, comp);
    if (!opts.keepView) state.view = "home";
  }

  async function onFile(file) {
    if (!file) return;
    try {
      const ab = await file.arrayBuffer();
      if (state.pending.length && !confirm("Discard " + state.pending.length + " unsaved change(s) and load this file?")) return;
      state.pending = [];
      await loadArrayBuffer(ab, file.name, file.lastModified ? new Date(file.lastModified) : new Date());
      await persist();
      render();
      toast("Loaded " + file.name);
    } catch (e) {
      console.error(e);
      alert("Could not read this workbook: " + e.message);
    }
  }

  function bind() {
    const app = $("#app");
    app.onclick = function (ev) {
      const t = ev.target.closest("[data-act], [data-tab]");
      if (!t) return;
      const tab = t.getAttribute("data-tab");
      if (tab) {
        haptic(6);
        state.view = tab;
        if (tab === "more") state.moreScreen = "menu";
        render();
        window.scrollTo(0, 0);
        return;
      }
      const act = t.getAttribute("data-act");
      const row = t.getAttribute("data-row") ? Number(t.getAttribute("data-row")) : null;
      const list = t.getAttribute("data-list");
      switch (act) {
        case "open": { const inp = $("#file"); if (inp) inp.click(); break; }
        case "save": if (state.pending.length) openPending(); else toast("No unsaved changes"); break;
        case "save-now": saveExcel(); break;
        case "undo": {
          const op = state.pending.pop();
          persist(); render();
          if (op) toast("Undid: " + op.label);
          break;
        }
        case "remove-op": {
          const id = t.getAttribute("data-id");
          state.pending = state.pending.filter(function (o) { return o.id !== id; });
          persist(); render(); if (state.pending.length) openPending();
          break;
        }
        case "close-sheet": closeSheet(); break;
        case "add-receipt": openReceiptForm(null); break;
        case "add-receipt-for": {
          const id = t.getAttribute("data-id");
          closeSheet();
          setTimeout(function () {
            openReceiptForm(null);
            const sel = document.querySelector('#sheet [name="loanId"]');
            if (sel) sel.value = id;
          }, 50);
          break;
        }
        case "edit-receipt": openReceiptForm(row); break;
        case "add-loan": openLoanForm(null); break;
        case "edit-loan": openLoanForm(row); break;
        case "add-asset":
        case "add-menu": openAddMenu(); break;
        case "dismiss-hint":
          state.hintDismissed = true;
          try { localStorage.setItem("pf-hint-dismissed", "1"); } catch (e) {}
          render();
          break;
        case "add-account": openGeneric("account", null); break;
        case "add-property": openGeneric("property", null); break;
        case "edit-account": openGeneric("account", row); break;
        case "edit-property": openGeneric("property", row); break;
        case "add-debt": openGeneric("debt", null); break;
        case "edit-debt": openGeneric("debt", row); break;
        case "add-ins": openGeneric("insurance", null); break;
        case "edit-ins": openGeneric("insurance", row); break;
        case "add-biz": openGeneric("business", null); break;
        case "edit-biz": openGeneric("business", row); break;
        case "add-hist": openGeneric("history", null); break;
        case "edit-hist": openGeneric("history", row); break;
        case "add-cf": openGeneric("cashflow", null, list); break;
        case "edit-cf": openGeneric("cashflow", row, list); break;
        case "edit-fx": openGeneric("fx", row); break;
        case "add-fx": openGeneric("fx", null); break;
        case "edit-type": openGeneric("types", row, list); break;
        case "add-type": openGeneric("types", null, list); break;
        case "edit-asof": openAsOf(); break;
        case "goto-assets": state.view = "assets"; render(); break;
        case "goto-debts": state.view = "more"; state.moreScreen = "debts"; render(); break;
        case "goto-history": state.view = "more"; state.moreScreen = "history"; render(); window.scrollTo(0, 0); break;
        case "show-more": {
          const key = t.getAttribute("data-key") || "";
          state.listShown = state.listShown || {};
          state.listShown[key] = (state.listShown[key] || 60) + 60;
          render();
          break;
        }
        case "group-toggle": {
          const key = t.getAttribute("data-key") || "";
          state.listGroup = state.listGroup || {};
          state.listGroup[key] = !state.listGroup[key];
          render();
          break;
        }
        case "more": state.moreScreen = t.getAttribute("data-screen") || "menu"; render(); window.scrollTo(0, 0); break;
        case "theme": {
          state.theme = state.theme === "auto" ? "dark" : state.theme === "dark" ? "light" : "auto";
          localStorage.setItem("pf-theme", state.theme);
          render();
          break;
        }
        default: break;
      }
    };
    const ov = $("#overlay");
    if (ov) ov.onclick = closeSheet;
    const sheetEl = $("#sheet");
    if (sheetEl) {
      sheetEl.oninput = sheetEl.onchange = function (ev) {
        const form = ev.target && ev.target.closest && ev.target.closest("form");
        if (form) updateFxHint(form);
      };
      sheetEl.onsubmit = function (ev) {
        ev.preventDefault();
        const form = ev.target;
        const kind = form.getAttribute("data-form");
        if (kind === "receipt") submitReceipt(form);
        else if (kind === "loan") submitLoan(form);
        else if (kind === "generic") submitGeneric(form);
        else if (kind === "asof") submitAsOf(form);
      };
    }
    const inp = $("#file");
    if (inp) inp.onchange = function () { onFile(inp.files && inp.files[0]); inp.value = ""; };
    document.querySelectorAll('[data-role="search"]').forEach(function (search) {
      search.oninput = function () {
        const key = search.getAttribute("data-key") || "receipts";
        state.listQuery = state.listQuery || {};
        state.listQuery[key] = search.value;
        state.search = search.value;
        state.listShown = state.listShown || {};
        state.listShown[key] = 60;
        const pos = search.selectionStart;
        render();
        const s2 = document.querySelector('[data-role="search"][data-key="' + key + '"]');
        if (s2) { s2.focus(); try { s2.setSelectionRange(pos, pos); } catch (e) {} }
      };
    });
    document.querySelectorAll('[data-role="list-sort"]').forEach(function (sel) {
      sel.onchange = function () {
        const key = sel.getAttribute("data-key") || "";
        state.listSort = state.listSort || {};
        state.listSort[key] = sel.value;
        state.listShown = state.listShown || {};
        state.listShown[key] = 60;
        render();
      };
    });
  }

  function openAddMenu() {
    function item(act, icon, color, title, meta, testid) {
      return '<button class="row" data-act="' + act + '" data-testid="' + testid + '">' +
        '<div class="icon-bubble" style="background:' + color + '">' + svg(icon, 18) + "</div>" +
        '<div class="body"><div class="title">' + title + '</div><div class="meta">' + meta + "</div></div>" +
        svg("chev", 18) + "</button>";
    }
    openSheet('<div class="sheet-handle"></div><div class="sheet-head"><button class="pill ghost" data-act="close-sheet">Cancel</button><h2>Add</h2><span style="width:64px"></span></div>' +
      '<div class="sheet-body" data-testid="add-sheet"><div class="list-card">' +
      item("add-receipt", "receipts", "var(--gold)", "Add payment", "A payment you received", "add-pick-receipt") +
      item("add-account", "assets", "var(--teal)", "Add balance", "A bank or cash account", "add-pick-account") +
      item("add-loan", "loans", "var(--navy)", "Add loan", "Money you have lent", "add-pick-loan") +
      item("add-property", "assets", "var(--green)", "Add property", "A home or other property", "add-pick-property") +
      item("add-debt", "loans", "var(--coral)", "Add debt", "Money you owe", "add-pick-debt") +
      item("add-hist", "file", "var(--blue)", "Add snapshot", "Save a net-worth snapshot", "add-pick-hist") +
      "</div></div>");
  }
  function openAssetChooser() { openAddMenu(); }

  async function boot() {
    applyTheme();
    try {
      const ab = await idbGet("file");
      if (ab) {
        const name = await idbGet("fileName");
        const dt = await idbGet("fileDate");
        await loadArrayBuffer(ab, name, dt ? new Date(dt) : null);
        const pend = await idbGet("pending");
        state.pending = Array.isArray(pend) ? pend : [];
      }
    } catch (e) { console.warn("restore failed", e); }
    render();
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.__PF_NO_SW) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  }

  window.__pf = {
    state: state, liveModel: liveModel, liveComputed: liveComputed, computeAll: computeAll,
    buildUpdatedXlsx: buildUpdatedXlsx, loadArrayBuffer: loadArrayBuffer, render: render,
    saveExcel: saveExcel
  };
  document.addEventListener("DOMContentLoaded", boot);
})();

</script>
</body>
</html>
